services:
  gemma4-26b-a4b:
    image: ${LLAMA_CPP_IMAGE:-localhost/llama.cpp:server-vulkan-b8740-gemma4}
    build:
      context: ${LLAMA_CPP_SOURCE:-/home/completetrain/llama.cpp-b8740-vulkan}
      dockerfile: .devops/vulkan.Dockerfile
      target: server
      args:
        UBUNTU_VERSION: "24.04"
    container_name: ${LLAMA_CPP_CONTAINER:-completetrain-home-complete-tech-llama}
    restart: unless-stopped
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_AUDIO_TRANSCRIPTION_URL: ${GEMMA4_AUDIO_TRANSCRIPTION_URL:-http://172.30.88.45:2022/v1/audio/transcriptions}
      LLAMA_AUDIO_TRANSCRIPTION_MODEL: ${GEMMA4_AUDIO_TRANSCRIPTION_MODEL:-whisper-1}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - llama-gemma4-cache:/root/.cache
      - ${GEMMA4_TEMPLATE_PATH:-./templates/google-gemma-4-31B-it-interleaved.fixed.jinja}:/templates/google-gemma-4-31B-it-interleaved.fixed.jinja:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18084/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command:
      - --hf-repo
      - ${GEMMA4_MODEL_REPO:-ggml-org/gemma-4-26b-a4b-it-GGUF:Q4_K_M}
      - --jinja
      - --chat-template-file
      - /templates/google-gemma-4-31B-it-interleaved.fixed.jinja
      - --host
      - 0.0.0.0
      - --port
      - ${GEMMA4_PORT:-18084}
      - --ctx-size
      - ${GEMMA4_CONTEXT_SIZE:-65536}
      - --gpu-layers
      - all
      - --reasoning
      - on
      - --reasoning-format
      - deepseek
      - --reasoning-budget
      - ${GEMMA4_REASONING_BUDGET:-192}
      - --cache-ram
      - "0"
      - --slot-prompt-similarity
      - "1.0"
      - --flash-attn
      - on
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --temp
      - "0"
      - --parallel
      - "1"
    networks:
      openclaw_net:
        ipv4_address: ${GEMMA4_STATIC_IP:-172.30.88.4}

volumes:
  llama-gemma4-cache:
    name: ${LLAMA_CPP_CACHE_VOLUME:-llama-gemma4-cache}

networks:
  openclaw_net:
    external: true
    name: ${OPENCLAW_NETWORK:-deploy_openclaw_net}
